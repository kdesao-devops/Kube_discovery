apiVersion: v1
kind: Service
metadata: { name: keycloak-server, namespace: keycloak }
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak-server, namespace: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8
          args: ["start"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_DB_URL, value: jdbc:postgresql://postgres:5432/keycloak }
            - { name: KC_HOSTNAME, value: keycloak.localtest.me }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1024Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-server
                port:
                  number: 8080