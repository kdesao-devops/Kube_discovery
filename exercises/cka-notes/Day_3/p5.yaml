apiVersion: v1
kind: Pod
metadata:
  labels:
    run: p5
  name: p5
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disk
            operator: In
            values:
            - ssd
  containers:
  - image: nginx
    name: p5
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
