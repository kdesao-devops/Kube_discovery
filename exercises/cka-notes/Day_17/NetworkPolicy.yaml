apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      role: db                # pods the policy applies to (check: k get pods --show-labels)
  policyTypes:
  - Ingress                   # listed with no ingress rule below = all ingress denied
  - Egress
  egress:
  - to:                       # rule 1: payroll on 8080
    - podSelector:
        matchLabels:
          name: payroll
    ports:
    - protocol: TCP
      port: 8080
  - to:                       # rule 2: mysql on 3306
    - podSelector:
        matchLabels:
          name: mysql
    ports:
    - protocol: TCP
      port: 3306
  - to:                       # rule 3: DNS, only to CoreDNS in kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53