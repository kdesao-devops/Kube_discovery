apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /         # path sent to the backend
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: critical-ingress
  namespace: critical-space
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: pay-service
            port:
              number: 8282
        path: /pay            # path matched from outside
        pathType: Exact
status:
  loadBalancer: {}